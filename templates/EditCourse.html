<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Course | Course Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/AdminDashboard.css') }}"
    />

    <link rel="stylesheet" href="/static/css/EditCourse.css" />
  </head>

  <body>
    <!-- Sidebar -->

    <div class="sidebar">
      <div class="sidebar-menu">
        <p class="menu-title">MAIN MENU</p>

        <a href="{{ url_for('AdminDashboard') }}">
          <i class="bi bi-grid"></i>
          Dashboard
        </a>

        <a href="{{ url_for('ManageCourses') }}" class="active">
          <i class="bi bi-book"></i>
          Manage Courses
        </a>

        <a href="{{ url_for('ManageStudents') }}">
          <i class="bi bi-people"></i>
          Manage Students
        </a>

        <a href="{{ url_for('ManageRegistrations') }}">
          <i class="bi bi-journal-check"></i>
          Registrations
        </a>

        <p class="menu-title">ACCOUNT</p>

        <a href="{{ url_for('AdminProfile') }}">
          <i class="bi bi-person-circle"></i>
          Profile
        </a>

        <a href="{{ url_for('AdminSettings') }}">
          <i class="bi bi-gear"></i>
          Settings
        </a>
      </div>

      <a href="{{ url_for('logout') }}" class="logout">
        <i class="bi bi-box-arrow-left"></i>
        Logout
      </a>
    </div>

    <!-- Main Content -->

    <div class="main-content">
      <div class="topbar">
        <div>
          <h2>Edit Course</h2>
          <p>Update existing course details.</p>
        </div>

        <div class="admin-profile">
          <i class="bi bi-person-circle"></i>
          {{ session.get('admin_name', 'Administrator') }}
        </div>
      </div>

      <!-- Edit Form -->

      <div class="edit-box">
        <h4 class="mb-4">Update Course Details</h4>

        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Course Name</label>

              <input
                type="text"
                name="course_name"
                class="form-control"
                value="{{ course[1] }}"
                required
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Course Code</label>

              <input
                type="text"
                name="course_code"
                class="form-control"
                value="{{ course[2] }}"
                required
              />
            </div>

            <div class="col-md-12">
              <label class="form-label">Description</label>

              <textarea name="description" class="form-control" rows="4">
{{ course[3] or '' }}</textarea
              >
            </div>

            <div class="col-md-6">
              <label class="form-label">Credits</label>

              <input
                type="number"
                name="credits"
                class="form-control"
                min="1"
                value="{{ course[4] }}"
                required
              />
            </div>

            <div class="col-md-12 mt-4">
              <button type="submit" class="custom-btn">
                <i class="bi bi-check-circle"></i>
                Update Course
              </button>

              <a
                href="{{ url_for('ManageCourses') }}"
                class="btn btn-secondary ms-2"
              >
                Cancel
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
